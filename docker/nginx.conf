server {
  listen 80;
  root /usr/share/nginx/html;

  # Hashed build assets never change, so browsers can keep them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Prerendered pages are served as files (/projects -> projects.html); anything else gets the
  # plain app shell, which renders client-side.
  location / {
    try_files $uri $uri.html $uri/ /404.html;
  }
}
